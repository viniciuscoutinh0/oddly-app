services:
  oddly_php:
    container_name: oddly_php
    build:
      context: "./.docker"
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - "./.:/var/www/html"

  oddly_http:
    container_name: oddly_http
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - "./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./.:/var/www/html"
    depends_on:
      - "oddly_php"

  oddly_redis:
    container_name: oddly_redis
    image: redis:8.2-alpine
    ports:
      - "6379:6379"

